    answers:
      short:
        - "Politeknik Insan Tazakka memiliki 2 kampus. Kampus 1 di Jl. Ir. Haji Juanda (Jl. Sukaseuri) No.27, Sarimulya, Kota Baru, Karawang. Kampus 2 di Jl. Raya Pangulah No.126, Pangulah Utara, Kota Baru, Karawang."
      medium:
        - "Politeknik Insan Tazakka memiliki dua lokasi kampus. **Kampus 1** beralamat di Jl. Ir. Haji Juanda (Jl. Sukaseuri) No.27, Kelurahan Sarimulya, Kecamatan Kota Baru, Karawang, Jawa Barat 41373. **Kampus 2** beralamat di Jl. Raya Pangulah No.126, Pangulah Utara, Kecamatan Kota Baru, Karawang, Jawa Barat 41374. Keduanya berada di wilayah Karawang, Jawa Barat."
      long:
        - "Politeknik Insan Tazakka beroperasi di dua kampus yang terletak di Karawang, Jawa Barat. **Kampus 1** tepatnya berada di **Jl. Ir. Haji Juanda (Jl. Sukaseuri) No.27, Kelurahan Sarimulya, Kecamatan Kota Baru, Kabupaten Karawang, Jawa Barat, dengan kode pos 41373**. **Kampus 2** berlokasi di **Jl. Raya Pangulah No.126, Pangulah Utara, Kecamatan Kota Baru, Kabupaten Karawang, Jawa Barat, kode pos 41374**. Disarankan untuk mengecek lokasi spesifik kegiatan karena aktivitas akademik dapat berlangsung di kedua kampus tersebut."

  - questions:
      - "Bagaimana cara menuju kampus?"
      - "Akses transportasi ke kampus gimana?"
      - "Bisa diakses angkutan umum ga?"
      - "Naik apa ya ke kampusnya?"
      - "Kendaraan umum ke Tazakka ada?"
      # Typo Kecil
      - "Gmn cara ke kampus?"
      - "Akses transportasi ke kampus gmn?"
      - "Bsa dgn angkot ga?"
      - "Naik apa ke kampus?"
      # Typo Besar
      - "cara ke kpus"
      - "transportasi ke kampus ada ga"
      - "angkut umum ke tzk"
      - "gmna sampe kampus"
    answers:
      short:
        - "Kampus dapat diakses dengan kendaraan pribadi, ojek online, dan angkutan umum."
      medium:
        - "Kedua kampus Politeknik Insan Tazakka mudah diakses. Anda dapat menggunakan **kendaraan pribadi** (mobil/motor), **ojek online** (Gojek, Grab), atau **angkutan umum** (angkutan kota/angkudes) yang melintasi rute jalan utama di Karawang."
      long:
        - "Akses menuju Politeknik Insan Tazakka terbilang mudah. Beberapa pilihan transportasi yang dapat digunakan antara lain: 1. **Kendaraan Pribadi** (mobil/motor), disarankan menggunakan GPS untuk navigasi. 2. **Ojek Online** (seperti Gojek atau Grab), cukup populer dan praktis di area Karawang. 3. **Angkutan Umum** (angkutan kota atau 'angkudes'), yang melayani rute sepanjang jalan utama tempat kedua kampus berada. Pastikan untuk memberitahu sopir tujuan Anda (Kampus 1 atau Kampus 2) karena lokasinya berbeda."

  - questions:
      - "Apa patokan atau landmark dekat Kampus 1?"
      - "Kampus 1 di dekat mana?"
      - "Tempat terkenal dekat Kampus 1 apa?"
      - "Supaya gampang nyarinya, dekat mana Kampus 1?"
      # Typo Kecil
      - "Patokan Kampus 1 apa?"
      - "Dekat mn Kampus 1?"
      - "Landmark dekat kampus 1?"
      - "Agar gmpang nyari, dekat mana?"
      # Typo Besar
      - "tmpt kncl kpus 1"
      - "deket mana kampus 1"
      - "patokan lokasi kampus satu"
      - "gmn biar gampang ketemu kampus 1"
    answers:
      short:
        - "Kampus 1 bersebelahan dengan Gedung Kampus BSI dan berada di depan Kantor Dinas Perhubungan (Dishub)."
      medium:
        - "**Kampus 1** Politeknik Insan Tazakka memiliki patokan yang mudah dikenali. Lokasinya **tepat di depan Kantor Dinas Perhubungan (Dishub) Karawang** dan **bersebelahan dengan Gedung Kampus BSI (Bank Syariah Indonesia)** di Jalan Ir. H. Juanda."
      long:
        - "Untuk memudahkan pencarian, **Kampus 1 Politeknik Insan Tazakka** memiliki penanda lokasi yang sangat jelas. Kampus ini berada **tepat di seberang atau berhadapan dengan Kantor Dinas Perhubungan (Dishub) Kabupaten Karawang**. Selain itu, bangunan kampus **berdampingan (bersebelahan) dengan Gedung Kampus BSI (Bank Syariah Indonesia)** yang juga cukup dikenal. Jadi, jika Anda menemukan Kantor Dishub atau Kampus BSI di Jalan Ir. H. Juanda (menuju Tol Cikampek), maka Anda sudah sampai di lokasi Kampus 1."

  - questions:
      - "Apa patokan atau landmark dekat Kampus 2?"
      - "Kampus 2 di dekat mana?"
      - "Kalau dari Jakarta, lewat mana ke Kampus 2?"
      - "Dari arah Cirebon, dekat mana Kampus 2?"
      # Typo Kecil
      - "Patokan Kampus 2 apa?"
      - "Dekat mn Kampus 2?"
      - "Dri Jakarta, dekat patokan apa?"
      - "Dri Cirebon, deket mana?"
      # Typo Besar
      - "tmpt kncl kpus 2"
      - "kampus dua deket spbu ga"
      - "dri jkt nyampe kampus 2 lewat mana"
      - "patokan dri cirebon"
    answers:
      short:
        - "Kampus 2 berada di Jalan Pantura, dekat SPBU Pertamina (dari arah Jakarta) dan dekat Kantor Pool Bus Sahabat (dari arah Cirebon)."
      medium:
        - "**Kampus 2** berlokasi di **Jalan Raya Pantura** (jalan utama lintas utara Jawa). **Jika datang dari arah Jakarta**, kampus ini berada **setelah/sesudah SPBU Pertamina**. **Jika datang dari arah Cirebon**, kampus berada **sebelum/menuju Kantor Pool Bus Sahabat**."
      long:
        - "**Kampus 2 Politeknik Insan Tazakka** terletak di tepi **Jalan Raya Pantura**, jalan nasional yang ramai. Untuk memudahkan pencarian, berikut patokan berdasarkan arah perjalanan: 1. **Bila Anda datang dari arah Jakarta (Barat)**: Setelah melewati area Karawang, perhatikan sebelah kanan jalan. Kampus 2 berada **setelah Anda melewati sebuah SPBU Pertamina**. 2. **Bila Anda datang dari arah Cirebon (Timur)**: Sebelum sampai di pusat Kota Baru Karawang, perhatikan sebelah kiri jalan. Kampus 2 berada **sebelum atau dekat dengan Kantor Pool/Bus Sahabat**. Lokasinya cukup strategis dan mudah dikenali dari jalan raya."

  - questions:
      - "Apa saja fasilitas umum di sekitar kampus?"
      - "Ada minimarket atau tempat makan dekat kampus ga?"
      - "Fasilitas dekat kampus seperti apa?"
      - "Ada bank di dalam kampus?"
      # Typo Kecil
      - "Fasilitas umm di sekitr kampus apa?"
      - "Ada minimarket atau makan deket ga?"
      - "Ada fotocopy dekat kampus?"
      - "Bank di dlm kampus ada?"
      # Typo Besar
      - "tmkt mkn deket kpus"
      - "fasilitas skitar"
      - "fotokopi ada ga"
      - "bank klinik dekat kampus"
    answers:
      short:
        - "Ada fotokopi, bank di dalam kampus, klinik (Putra Medica & Balai Kesehatan Mata), dan toko ritel besar di dekatnya."
      medium:
        - "Berbagai fasilitas umum tersedia di sekitar kampus. Di **sebelah kampus** terdapat **tempat fotokopi**. Di **dalam area kampus** tersedia **layanan bank**. Terdapat juga **klinik kesehatan**, yaitu Klinik Putra Medica di sebelah tempat fotokopi dan Balai Kesehatan Mata Masyarakat. Selain itu, ada **toko ritel besar** (seperti minimarket/supermarket) di dekat lokasi kampus."
      long:
        - "Lingkungan sekitar Politeknik Insan Tazakka mendukung aktivitas mahasiswa dengan fasilitas yang lengkap. Beberapa fasilitas yang mudah dijangkau antara lain: 1. **Usaha Fotokopi** yang terletak persis di sebelah kampus, sangat praktis untuk keperluan akademik. 2. **Layanan Bank** tersedia **di dalam area kampus** sendiri, memudahkan transaksi keuangan. 3. **Fasilitas Kesehatan**, seperti **Klinik Putra Medica** (berada di sebelah tempat fotokopi) dan **Balai Kesehatan Mata Masyarakat**. 4. **Toko Ritel Besar** (seperti Alfamart/Indomaret) berada dalam jarak yang dekat, memudahkan pembelian kebutuhan sehari-hari. Jadi, mahasiswa tidak perlu khawatir untuk urusan logistik dasar."

  - questions:
      - "Bagaimana suasana lingkungan sekitar kampus?"
      - "Kampusnya di area seperti apa? Ramai atau tenang?"
      - "Lingkungan kampus 1 dan 2 beda ga?"
      - "Apakah kampus dekat dengan pemukiman?"
      # Typo Kecil
      - "Suasana lingkrng kampus gmn?"
      - "Area kampus rame atau sepii?"
      - "Lingkungan kampus 1 sm 2 beda?"
      - "Dekat perumahan ga?"
      # Typo Besar
      - "suasana skitar kpus"
      - "kampus di tmpt rame ga"
      - "beda lingkungan kampus 1 2"
      - "deket rumah penduduk ga"
    answers:
      short:
        - "Kampus 1 dekat pemukiman di jalan menuju tol. Kampus 2 berada di pinggir Jalan Pantura yang ramai."
      medium:
        - "Suasana kedua kampus berbeda. **Kampus 1** terletak di **pinggir jalan utama menuju Tol Cikampek** dan berada **dekat dengan area pemukiman penduduk**, sehingga lingkungannya lebih terkait dengan aktivitas warga. **Kampus 2** berada persis di **pinggir Jalan Raya Pantura** yang merupakan jalur transportasi barang lintas Jawa, sehingga suasana di sekitarnya lebih ramai oleh lalu lintas kendaraan."
      long:
        - "Karakteristik lingkungan sekitar kedua kampus Politeknik Insan Tazakka memiliki ciri khas masing-masing. **Kampus 1** berlokasi di **jalan protokol yang mengarah ke Tol Cikampek**. Lokasinya **berdekatan dengan kompleks pemukiman warga**, sehingga suasana di sekitarnya mencerminkan kehidupan komunitas permukiman dengan aktivitas warga yang cukup padat. **Kampus 2** memiliki nuansa yang berbeda karena **berada tepat di tepi Jalan Raya Pantura**, jalur nasional yang sangat sibuk dengan arus truk dan kendaraan antar kota. Lingkungan sekitar Kampus 2 cenderung lebih komersial dan dinamis akibat aktivitas transportasi ini. Mahasiswa dapat merasakan pengalaman yang berbeda di masing-masing kampus."

  - questions:
      - "Apakah ada hal khusus yang perlu diketahui mahasiswa baru tentang lokasi?"
      - "Tips untuk mahasiswa baru datang ke kampus pertama kali?"
      - "Perlu bawa kendaraan pribadi ga?"
      - "Ada yang perlu diwaspadai ga soal lokasinya?"
      # Typo Kecil
      - "Hal khusus buat maba soal lokasi?"
