      - "Ada yg perlu di perhatikan?"
      # Typo Besar
      - "tips maba dtg kampus"
      - "perlu kndraan pribadi ga"
      - "hati2 di lokasi kampus"
      - "saran buat baru dtg"
    answers:
      short:
        - "Tidak ada informasi khusus selain pastikan alamat dan patokan yang disebutkan."
      medium:
        - "Tidak ada informasi kebijakan khusus yang disampaikan mengenai lokasi. Disarankan untuk **memastikan alamat dan patokan (landmark) dengan baik** sebelum berangkat, terutama membedakan antara Kampus 1 dan Kampus 2. Gunakan aplikasi peta digital untuk membantu navigasi."
      long:
        - "Berdasarkan informasi yang tersedia, tidak ada hal khusus atau kebijakan tambahan yang perlu diketahui mahasiswa baru terkait lokasi kampus. Saran utama adalah: 1. **Pastikan tujuan kampus (Kampus 1 atau Kampus 2)** sesuai dengan jadwal atau informasi acara yang diikuti. 2. **Gunakan patokan/landmark** yang telah disebutkan (seperti Kantor Dishub untuk Kampus 1 atau SPBU Pertamina untuk Kampus 2) karena lebih mudah dikenali daripada nomor jalan saja. 3. **Manfaatkan aplikasi peta digital** seperti Google Maps atau Waze dengan memasukkan alamat lengkap yang telah diberikan untuk panduan navigasi yang akurat. 4. Untuk kunjungan pertama, mungkin perlu menyediakan waktu lebih awal untuk mengantisipasi kemungkinan tersesat."