      long:
        - "Politeknik Insan Tazakka telah berhasil mendapatkan pengakuan resmi dari Badan Akreditasi Nasional Perguruan Tinggi (BAN-PT). Status akreditasi institusi yang diraih adalah peringkat **BAIK**. Peringkat ini mencerminkan kualitas penyelenggaraan pendidikan tinggi di kampus secara keseluruhan dan berlaku sejak 5 Desember 2025."

  - questions:
      - "Apa saja program studi yang terakreditasi di Politeknik Insan Tazakka?"
      - "Prodi apa saja yang ada dan akreditasinya?"
      - "Semua prodi di Tazakka akreditasinya apa?"
      - "Akreditasi untuk setiap jurusannya bagaimana?"
      - "Bagaimana akreditasi prodi-prodi di sini?"
      # Typo Kecil
      - "Prodi yg ada apa aja dan akreditasinya?"
      - "Jurusan2 di tazakka akreditasinya gmn?"
      - "Apa sj prodi yg terakreditasi?"
      - "Akreditasi tiap jurusan?"
      # Typo Besar
      - "list prodi dan akred"
      - "jurusan akredit brp"
      - "prodi tazakka nilai akred"
      - "semua jurusan terakreditasi ga"
      - "akred prodi"
    answers:
      short:
        - "Ada 3 prodi: Teknik Rekayasa Komputer, Teknik Rekayasa Manufaktur, dan Teknik Rekayasa Logistik. Semuanya terakreditasi **BAIK**."
      medium:
        - "Politeknik Insan Tazakka memiliki tiga Program Studi (Prodi), yaitu: 1. Teknik Rekayasa Komputer, 2. Teknik Rekayasa Manufaktur, dan 3. Teknik Rekayasa Logistik. Ketiganya telah meraih akreditasi dengan peringkat **BAIK** dari lembaga akreditasi yang berwenang."
      long:
        - "Politeknik Insan Tazakka menyelenggarakan tiga Program Studi Diploma yang semuanya telah terakreditasi dengan baik. Berikut daftarnya beserta status akreditasinya: 1. **Teknik Rekayasa Komputer** (Terakreditasi BAIK), 2. **Teknik Rekayasa Manufaktur** (Terakreditasi BAIK), dan 3. **Teknik Rekayasa Logistik** (Terakreditasi BAIK). Akreditasi untuk ketiga prodi ini diberikan pada 29 Agustus 2024 dan merupakan bukti komitmen kampus terhadap kualitas pendidikan di setiap jurusan."

  - questions:
      - "Akreditasi dari lembaga mana saja yang dimiliki kampus?"
      - "Siapa yang mengeluarkan akreditasi untuk Politeknik Insan Tazakka?"
      - "Akreditasi BAIK itu dari BAN-PT saja?"
      - "Lembaga akreditasi apa saja yang mengakui kampus ini?"
      # Typo Kecil
