topic: status_akreditasi
knowledge:
  - questions:
      # Variasi Formal
      - akreditasi universitas codepolitan
      - kampus sudah terakreditasi belum
      - akreditasi prodi teknik
      - apa status akreditasi kampus ini
      - apakah sudah terdaftar di ban-pt
      # Variasi Bahasa Santai/Natural
      - kampusnya udah akreditasi belum kak
      - univ codepolitan akreditasinya apa ya
      - jurusannya sudah ada akreditasinya belum
      - mau tanya status akreditasi kampusnya dong
      - cek akreditasi prodi teknik rekayasa
      - apakah ijazahnya nanti diakui pemerintah
      - legalitas kampus codepolitan gimana
      - kampus ini resmi terdaftar kan ya
    answer:
      - >
        Tenang saja, Universitas Codepolitan beserta seluruh program studinya sudah resmi 
        terakreditasi oleh BAN-PT kok. Jadi legalitasnya sudah terjamin. Kalau kamu butuh 
        detail nilai akreditasi tiap prodi, langsung tanya ke bagian administrasi ya!
      - >
        Untuk status akreditasi, Universitas Codepolitan sudah terakreditasi oleh BAN-PT, 
        begitu juga dengan semua jurusan Teknik Rekayasa yang ada di sini. Untuk info 
        lebih lengkapnya, kamu bisa mampir ke kantor admin di jam operasional.
      - >
        Semua prodi di sini sudah terakreditasi BAN-PT, kak. Jadi nggak perlu khawatir soal 
        kualitas dan pengakuan ijazahnya nanti. Mau tanya detail akreditasi buat prodi apa?