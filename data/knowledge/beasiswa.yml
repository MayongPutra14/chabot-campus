topic: info_beasiswa
knowledge:
  - questions:
      - ada beasiswa apa saja
      - beasiswa universitas codepolitan
      - syarat beasiswa codepolitan
      - beasiswa tahfiz
      - cara mendapatkan beasiswa
    answer: >
      Tersedia beasiswa Tahfiz Quran (min. 5 juz), beasiswa lulusan SMK Codepolitan, 
      dan program kerja sama. Beasiswa berlaku selama masa perkuliahan sesuai ketentuan.