topic: biaya_kuliah
knowledge:
  - questions:
      - biaya kuliah di universitas codepolitan
      - uang kuliah per semester
      - biaya masuk codepolitan
      - ada uang gedung tidak
      - biaya pendaftaran
    answer: >
      Pendaftaran gratis dan tidak ada uang gedung. Biaya kuliah per semester 
      adalah Rp4.800.000 dan dapat dicicil sebesar Rp700.000 per bulan.