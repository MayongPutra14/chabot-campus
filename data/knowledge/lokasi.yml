topic: lokasi_kampus
knowledge:
  - questions:
      - kampus di mana
      - alamat universitas codepolitan
      - lokasi kampus codepolitan
      - universitas codepolitan di mana
      - kampus dekat apa
    answer: >
      Universitas Codepolitan beralamat di Karawang, Jl. Jenderal Sudirman, 
      Kecamatan Kota Lama, Jawa Barat. Kampus berada di dekat Kampus BSI 
      dan di depan Kantor Dishub.