    answers:
      short:
        - Kampus buka pukul 08.00–16.00 WIB, Senin sampai Sabtu.
        - Jam operasional kampus dari jam 8 pagi sampai jam 4 sore.
        - Kampus beroperasi Senin–Sabtu pukul 08.00–16.00 WIB.

      medium:
        - Politeknik Insan Tazakka buka setiap hari Senin sampai Sabtu, mulai pukul 08.00 hingga 16.00 WIB. Layanan administrasi mengikuti jam tersebut.
        - Jam operasional kampus adalah pukul 08.00–16.00 WIB dari hari Senin sampai Sabtu. Kampus tutup pada hari Minggu dan libur nasional.

      long:
        - Politeknik Insan Tazakka memiliki jam operasional kampus dan layanan administrasi yang sama, yaitu pukul 08.00 hingga 16.00 WIB. Kampus buka dari hari Senin sampai Sabtu, dan tutup pada hari Minggu serta hari libur nasional sesuai ketentuan pemerintah. Untuk memastikan layanan tersedia, disarankan datang pada jam operasional tersebut.
