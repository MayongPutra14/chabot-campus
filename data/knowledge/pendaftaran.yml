topic: alur_pendaftaran
knowledge:
  - questions:
      - cara daftar kuliah di codepolitan
      - bagaimana pendaftaran universitas codepolitan
      - alur pendaftaran mahasiswa baru
      - syarat masuk universitas codepolitan
      - jalur masuk codepolitan
    answer: >
      Pendaftaran dilakukan secara offline dengan datang langsung ke kampus. 
      Jalur masuk meliputi beasiswa, karyawan, kerja sama, dan reguler. 
      Syarat utama adalah lulusan SMA/SMK sederajat dan melengkapi berkas administrasi.